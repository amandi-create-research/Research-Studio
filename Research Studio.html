<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Research Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400..700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap">
<style>
/* Layout: a calm, bright workspace in white, light blue and blue. The stage rail on the left shows where you are, the working sheet on the
   right shows one task at a time, and the guide card at the top always names the next step. Green, amber and red are reserved for check results. */
:root{
  --bg:#F2F7FD; --sheet:#FFFFFF; --sheet-2:#F4F8FE; --ink:#10233D; --muted:#4D5F78; --faint:#8494AB;
  --rule:#DCE6F3; --rule-strong:#C3D3E8;
  --accent:#1D5BD8; --accent-deep:#164AB3; --accent-ink:#FFFFFF; --accent-soft:#E8F1FF; --accent-line:#B5CFFA;
  --ok:#12734A; --ok-soft:#E1F4EA; --warn:#8A5A00; --warn-soft:#FFF3D6; --bad:#B3261E; --bad-soft:#FDE8E6;
  --shadow:0 1px 2px rgba(16,35,61,.05),0 10px 28px rgba(29,91,216,.08);
  --shadow-s:0 1px 2px rgba(16,35,61,.04),0 2px 8px rgba(29,91,216,.05);
  --f-ui:"Inter","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --f-display:var(--f-ui);
  --f-serif:"Newsreader","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:14px; --r-sm:9px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0C1422; --sheet:#131D2E; --sheet-2:#182438; --ink:#E4ECF7; --muted:#A3B3C9; --faint:#74859C;
  --rule:#243349; --rule-strong:#35486A;
  --accent:#7FAEFF; --accent-deep:#A5C5FF; --accent-ink:#0C1422; --accent-soft:#172B4D; --accent-line:#2E4C80;
  --ok:#63C793; --ok-soft:#13301F; --warn:#E4AF57; --warn-soft:#32270F; --bad:#F2857B; --bad-soft:#3A1916;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.28); --shadow-s:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root[data-theme="system"]{
    --bg:#0C1422; --sheet:#131D2E; --sheet-2:#182438; --ink:#E4ECF7; --muted:#A3B3C9; --faint:#74859C;
    --rule:#243349; --rule-strong:#35486A;
    --accent:#7FAEFF; --accent-deep:#A5C5FF; --accent-ink:#0C1422; --accent-soft:#172B4D; --accent-line:#2E4C80;
    --ok:#63C793; --ok-soft:#13301F; --warn:#E4AF57; --warn-soft:#32270F; --bad:#F2857B; --bad-soft:#3A1916;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.28); --shadow-s:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3,h4{text-wrap:balance;margin:0;letter-spacing:-.011em}
p{margin:0}
::selection{background:var(--accent-line)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:13.5px}
.tiny{font-size:12.5px}
.label{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--sheet)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--sheet) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--rule)}
.topbar-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:14px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.brand-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(140deg,#3B82F6,#1D5BD8 60%,#164AB3);display:grid;place-items:center;flex:none;box-shadow:0 2px 6px rgba(29,91,216,.3)}
.brand-mark svg{width:17px;height:17px;stroke:#fff}
.brand-name{font-size:18px;font-weight:650;letter-spacing:-.02em}
.brand-tag{font-size:12px;color:var(--faint)}
.topbar .spacer{flex:1}
.sys{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:640px){.brand-tag,.sys{display:none}}

.wrap{max-width:1240px;margin:0 auto;padding-block:24px 130px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--rule-strong);background:var(--sheet);color:var(--ink);border-radius:var(--r-sm);padding:8px 14px;min-height:38px;font-size:14px;font-weight:550;cursor:pointer;line-height:1.2;text-decoration:none;white-space:nowrap;transition:background .12s,border-color .12s,box-shadow .12s}
.btn:hover{border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent-deep)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 1px 2px rgba(29,91,216,.25)}
.btn.primary:hover{background:var(--accent-deep);border-color:var(--accent-deep);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--accent-soft);border-color:transparent;color:var(--accent-deep)}
.btn.danger{color:var(--bad);border-color:var(--rule-strong)}
.btn.danger:hover{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:6px 11px;min-height:32px;font-size:13.5px}
.btn.xs{padding:3px 8px;min-height:26px;font-size:12.5px;border-radius:7px}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn[disabled]:hover{background:var(--sheet);border-color:var(--rule-strong);color:var(--ink)}
.btn.primary[disabled]:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost[disabled]:hover{background:transparent;color:var(--muted)}
.btn svg{width:15px;height:15px;flex:none}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:550;border:1px solid var(--rule);background:var(--sheet-2);color:var(--muted);white-space:nowrap;line-height:1.5}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent-deep);border-color:transparent}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.chip.btnchip{cursor:pointer}
.chip.btnchip:hover{border-color:var(--accent-line);color:var(--accent-deep)}
.chip{max-width:100%;overflow:hidden;text-overflow:ellipsis}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lbl{font-size:13.5px;font-weight:600}
.hint{font-size:12.5px;color:var(--muted)}
input[type=text],input[type=number],input[type=search],input[type=password],select,textarea{width:100%;border:1px solid var(--rule-strong);background:var(--sheet);border-radius:var(--r-sm);padding:9px 11px;font-size:14.5px;min-width:0;transition:border-color .12s,box-shadow .12s}
textarea{resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=file]{font-size:13.5px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--rule-strong);background:var(--sheet);border-radius:var(--r-sm);padding:7px 12px;font-size:13.5px;font-weight:500;cursor:pointer;text-align:left;transition:background .12s,border-color .12s}
.seg button:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600}
.typegroups{display:flex;flex-direction:column;gap:10px}
.typegroup{display:flex;flex-direction:column;gap:6px}
.check{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.check input{width:17px;height:17px;accent-color:var(--accent);flex:none}
details.adv{border:1px solid var(--rule);border-radius:var(--r-sm);background:var(--sheet-2);padding:10px 14px}
details.adv>summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted);list-style:none;display:flex;align-items:center;gap:8px}
details.adv>summary::-webkit-details-marker{display:none}
details.adv>summary::before{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s;flex:none}
details.adv[open]>summary::before{transform:rotate(45deg)}
details.adv[open]>summary{color:var(--ink)}

/* panels */
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:20px;min-width:0;box-shadow:var(--shadow-s)}
.panel+.panel{margin-top:14px}
.panel-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.panel-h h3{font-size:16.5px;font-weight:650}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.stack-s{display:flex;flex-direction:column;gap:6px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.note{border:1px solid var(--accent-line);background:var(--accent-soft);padding:11px 14px;border-radius:var(--r-sm);font-size:14px}
.note.warn{border-color:transparent;background:var(--warn-soft)}
.note.bad{border-color:transparent;background:var(--bad-soft)}
.empty{border:1px dashed var(--rule-strong);border-radius:var(--r-sm);padding:20px;text-align:left;color:var(--muted);background:var(--sheet-2);font-size:14.5px}
hr.sep{border:0;border-top:1px solid var(--rule);margin:4px 0}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:center;margin-bottom:22px;padding:30px 32px;border-radius:20px;border:1px solid var(--accent-line);background:linear-gradient(135deg,var(--sheet) 0%,var(--accent-soft) 100%)}
.hero h1{font-weight:680;font-size:clamp(27px,3.6vw,40px);line-height:1.12;letter-spacing:-.025em}
.hero p{font-size:16px;color:var(--muted);max-width:60ch;margin-top:12px}
.flow{display:flex;flex-wrap:wrap;gap:7px;counter-reset:st}
.flow span{font-size:13px;font-weight:500;border:1px solid var(--accent-line);background:var(--sheet);border-radius:999px;padding:4px 12px 4px 5px;display:inline-flex;gap:7px;align-items:center}
.flow span::before{counter-increment:st;content:counter(st);font-size:11.5px;font-weight:650;width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;background:var(--accent);color:var(--accent-ink)}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr);padding:22px 20px}}
.home-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.home-grid{grid-template-columns:minmax(0,1fr)}}
.plist{display:flex;flex-direction:column;gap:8px}
.pitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;padding:14px 16px;border:1px solid var(--rule);border-radius:var(--r-sm);background:var(--sheet);cursor:pointer;text-align:left;width:100%;transition:border-color .12s,box-shadow .12s}
.pitem:hover{border-color:var(--accent);box-shadow:var(--shadow-s)}
.pitem h4{font-size:16.5px;font-weight:620;line-height:1.3}
.pbar{display:flex;gap:3px;grid-column:1/-1}
.pbar i{flex:1;height:5px;border-radius:3px;background:var(--rule)}
.pbar i.done{background:var(--accent)}
.pbar i.cur{background:var(--accent-line)}

/* project layout */
.proj-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.proj-head h2{font-size:clamp(21px,2.6vw,27px);font-weight:670;line-height:1.2;letter-spacing:-.02em}
.proj{display:grid;grid-template-columns:248px minmax(0,1fr);gap:20px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);display:flex;flex-direction:column;gap:2px;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:10px;box-shadow:var(--shadow-s)}
.rail-prog{padding:6px 8px 12px;border-bottom:1px solid var(--rule);margin-bottom:6px}
.rail-prog b{font-size:13px;font-weight:600}
.rail-prog .prog{height:6px;margin-top:8px;border-radius:3px}
.step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:center;padding:8px;border-radius:var(--r-sm);background:none;border:0;cursor:pointer;text-align:left;width:100%;position:relative;transition:background .12s}
.step:hover{background:var(--sheet-2)}
.step[aria-current="step"]{background:var(--accent-soft)}
.step[aria-current="step"]::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--accent)}
.step .num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:600;border:1.5px solid var(--rule-strong);color:var(--muted);background:var(--sheet)}
.step.done .num{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step .num svg{width:13px;height:13px}
.step[aria-current="step"] .num{border-color:var(--accent);color:var(--accent)}
.step.done[aria-current="step"] .num{color:var(--accent-ink)}
.step .t{font-size:14.5px;font-weight:580;line-height:1.25}
.step[aria-current="step"] .t{color:var(--accent-deep)}
.step .s{font-size:12.5px;color:var(--muted);line-height:1.3}
@media (max-width:900px){
  .proj{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;flex-direction:row;overflow-x:auto;padding:6px;gap:4px;scrollbar-width:thin}
  .rail-prog{display:none}
  .step{grid-template-columns:24px auto;width:auto;flex:none;padding:6px 12px 6px 6px}
  .step[aria-current="step"]::before{display:none}
  .step .s{display:none}
  .step .num{width:24px;height:24px}
}
.stage-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.stage-h h2{font-size:24px;font-weight:670;letter-spacing:-.02em}
.stage-h p{color:var(--muted);max-width:68ch;margin-top:4px}
.gate{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px;padding:16px 18px;border:1px solid var(--accent-line);border-radius:var(--r);background:var(--accent-soft)}

/* prisma counter */
.prisma{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.prisma div{border:1px solid var(--rule);border-radius:var(--r-sm);padding:10px 12px;background:var(--sheet-2)}
.prisma b{display:block;font-size:22px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.15;color:var(--accent-deep)}
.prisma span{font-size:12.5px;color:var(--muted)}

/* records */
.rec{border:1px solid var(--rule);border-radius:var(--r-sm);padding:12px 14px;background:var(--sheet);display:flex;flex-direction:column;gap:6px;min-width:0}
.rec .tt{font-weight:580;line-height:1.35}
.rec .meta{font-size:12.5px;color:var(--muted)}
.rec .abs{font-size:14px;color:var(--ink);background:var(--sheet-2);border-radius:var(--r-sm);padding:10px 12px;white-space:pre-wrap}
.rec.inc{border-left:3px solid var(--ok)}
.rec.exc{border-left:3px solid var(--rule-strong);opacity:.82}
.rec.uns{border-left:3px solid var(--warn)}
.keytag{font-family:var(--f-mono);font-size:11.5px;color:var(--accent-deep);background:var(--accent-soft);border-radius:5px;padding:0 5px}
.reldots{display:inline-flex;gap:2px;vertical-align:middle}
.reldots i{width:6px;height:6px;border-radius:50%;background:var(--rule-strong)}
.reldots i.on{background:var(--accent)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--rule);margin-bottom:12px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;font-size:14px;cursor:pointer;color:var(--muted);margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--accent-deep);border-bottom-color:var(--accent);font-weight:600}

/* table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--r-sm);max-width:100%}
table.tbl{border-collapse:collapse;width:100%;font-size:13.5px;min-width:860px}
.tbl th{text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--sheet-2);padding:9px 11px;border-bottom:1px solid var(--rule);white-space:nowrap}
.tbl td{padding:9px 11px;border-bottom:1px solid var(--rule);vertical-align:top;line-height:1.45}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--accent-soft)}
.figprev{border:1px solid var(--rule);border-radius:var(--r-sm);background:#fff;padding:10px;overflow-x:auto}
.figprev svg{display:block;max-width:100%;height:auto;margin:0 auto}

/* manuscript */
.ms{font-family:var(--f-serif);font-size:18px;line-height:1.68;max-width:70ch}
.ms p{margin:0 0 .85em}
.ms h4{font-family:var(--f-serif);font-size:18px;font-weight:600;margin:1em 0 .4em}
.cite{font:inherit;color:var(--accent-deep);background:var(--accent-soft);border:0;border-radius:4px;padding:0 3px;cursor:pointer}
.cite:hover{text-decoration:underline}
.cite.bad{color:var(--bad);background:var(--bad-soft)}
mark.missing{background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:0 3px;font-family:var(--f-ui);font-size:.8em;font-weight:600}
.sec{border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);padding:18px 20px;min-width:0;box-shadow:var(--shadow-s)}
.sec+.sec{margin-top:12px}
.sec-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start;margin-bottom:10px}
.sec-h h3{font-size:18.5px;font-weight:650}
.sec-h h3.l2{font-size:16.5px;font-weight:600;color:var(--muted)}
.sec textarea.mstext{font-family:var(--f-serif);font-size:16.5px;line-height:1.6;min-height:260px}
.wbar{height:6px;border-radius:3px;background:var(--rule);overflow:hidden;width:120px;display:inline-block;vertical-align:middle}
.wbar i{display:block;height:100%;background:var(--accent)}
.wbar.over i{background:var(--warn)}
.stream{white-space:pre-wrap}

/* verification */
.vmark{font-family:var(--f-mono);font-size:12px;font-weight:600}
.vbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--rule)}
.vbar i{display:block;height:100%}
.vbar .s1{background:var(--ok)} .vbar .s2{background:var(--warn)} .vbar .s3{background:var(--bad)} .vbar .s4{background:var(--rule-strong)}

  t("Fundort einer Belegstelle", () => { const l = locateQuote("Psychological therapy for anger was associated with a moderate effect size", ch); return eq(l ? l.label + " · " + l.status : "-", "Results · exact"); });
  const pages = { text: "", pages: [{ n: 1, label: "", text: "Introduction text about intellectual disability and depression in adults living in the community." }, { n: 2, label: "153", text: TAPP_ABSTRACT }] };
  t("Seitenangabe aus PDF-Seiten", () => { const l = locateQuote("There was evidence of heterogeneity and bias due to studies with small sample sizes", chunkDoc(null, pages)); return eq(l ? l.label : "-", "S. 153"); });
  /* word budget, revision checks, formats, model articles, figures */
  const keep = { revBudget: S.settings.revBudget, wordTol: S.settings.wordTol, clarity: S.settings.clarity };
  try {

  } finally { Object.assign(S.settings, keep); }
  t("Budgethinweis wird vom Text getrennt", () => { const r = splitBudgetNote("Erster Absatz.\n\nZweiter Absatz.\n[[BUDGET-HINWEIS: Die Ergänzung zur Stichprobe braucht etwa 60 Wörter mehr.]]"); return eq(r.text + " # " + r.note, "Erster Absatz.\n\nZweiter Absatz. # Die Ergänzung zur Stichprobe braucht etwa 60 Wörter mehr."); });
  const pA = "Psychological therapy for anger was associated with a moderate effect size in adults with intellectual disabilities [@R1]."; const pB = "Treatment for depression and anxiety was associated with a small and non-significant effect after outliers were removed [@R1].";
  t("Revision: unveränderte Absätze werden erkannt", () => { const c = changeStats(pA + "\n\n" + pB, pA + "\n\n" + pB.replace("small and non-significant", "small, statistically non-significant")); return eq(c.parasUnchanged + " von " + c.parasAfter + ", " + c.changedSentences.length + " geändert", "1 von 2, 1 geändert"); });
  t("Revision: wiederholte Aussage wird als Redundanz erkannt", () => eq(findRedundancy(pA + "\n\n" + pB + "\n\nIn adults with intellectual disabilities, psychological therapy for anger was associated with a moderate effect size [@R1].", "").length, 1));
  t("Revision: formelhafte Wendungen werden erkannt", () => eq(styleMetrics("It is important to note that sleep plays a crucial role in mental health. Die Diagnostik spielt eine zentrale Rolle.").generic.length, 2));

}
async function selfTestLiveCore({ signal, update }) {
  const out = []; const push = (name, ok, detail) => out.push({ name, ok, detail: detail || "" });
  for (let i = 0; i < FIXTURES.length; i++) {
    const f = FIXTURES[i]; const who = f.rec.authors[0].last + " (" + f.rec.year + ")";
    update("Live-Prüfung " + (i + 1) + " von " + FIXTURES.length + ": " + who, (i + 0.2) / FIXTURES.length);
    try {
      const [m] = await pubmedMeta([f.pmid], { signal });
      if (!m) push("PubMed · " + who, false, "PMID " + f.pmid + " nicht gefunden");
      else {
        const checks = [["Titel", titleSim(m.title, f.rec.title) >= 0.9], ["DOI", (m.doi || "").toLowerCase() === f.doi.toLowerCase()], ["Jahrgang", m.volume === f.rec.volume], ["Erstautor:in", (m.authors[0] || {}).last === f.rec.authors[0].last]];
        const bad = checks.filter((c) => !c[1]).map((c) => c[0]);
        push("PubMed · " + who, !bad.length, bad.length ? "Abweichung bei " + bad.join(", ") : "Titel, DOI, Jahrgang und Erstautor:in stimmen" + (NET.pubmedVia === "epmc" ? " (über Europe PMC)" : ""));
        if (f.exactLive) { const got = apaRefText(Object.assign({}, m, { kind: "article" })); push("APA 7 aus Live-Daten · " + who, got === f.apa, got === f.apa ? "identisch mit der Referenz" : "erwartet: " + f.apa + "\nerhalten: " + got); }
      }
    } catch (e) { if (e && e.code === "cancelled") throw e; push("PubMed · " + who, false, errText(e)); }
    try {
      const c = await crossrefByDoi(f.doi, { signal });
      push("Crossref · " + who, !!c && titleSim(c.title, f.rec.title) >= 0.8 && normTitle((c.authors[0] || {}).last) === normTitle(f.rec.authors[0].last), c ? "DOI aufgelöst: " + trunc(c.title, 80) : "DOI nicht gefunden");
    } catch (e) { if (e && e.code === "cancelled") throw e; push("Crossref · " + who, false, errText(e)); }
    try {
      const j = await http("OpenAlex", OPENALEX + "/doi:" + f.doi + "?select=id,title,publication_year", { gap: 150, signal });
      push("OpenAlex · " + who, titleSim(stripTags(j.title || ""), f.rec.title) >= 0.8, (j.id || "") + " · " + (j.publication_year || ""));
    } catch (e) { if (e && e.code === "cancelled") throw e; push("OpenAlex · " + who, false, errText(e)); }
    try {
      const r = await epmcSearch("EXT_ID:" + f.pmid + " AND SRC:MED", { cap: 1, signal });
      push("Europe PMC · " + who, r.records.length === 1 && titleSim(r.records[0].title, f.rec.title) >= 0.8, r.records.length ? "gefunden" : "nicht gefunden");
    } catch (e) { if (e && e.code === "cancelled") throw e; push("Europe PMC · " + who, false, errText(e)); }
  }
  return out;
}

    list("Offline", st.offline), list("Live", st.live));
